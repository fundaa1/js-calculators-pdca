<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Tip Calculator</h1>

        <div class="input-group">
            <label for="billAmount">Bill Amount:</label>
            <input type="number" id="billAmount" placeholder="Enter bill amount" min="0" step="0.01">
        </div>

        <div class="input-group">
            <p>Tip presets</p>
            <button class="tip-percent-btn" data-tip="0.15">15%</button>
            <button class="tip-percent-btn" data-tip="0.18">18%</button>
            <button class="tip-percent-btn" data-tip="0.20">20%</button>
            <label for="customTipPercentage">Custom tip percentage</label>
            <input type="number" id="customTipPercentage" placeholder="Custom %" min="0" step="0.1">
        </div>

        <div class="input-group">
            <label for="numberOfPeople">Number of People:</label>
            <input type="number" id="numberOfPeople" placeholder="Enter number of people" min="1" step="1" value="1" required>
        </div>

        <p id="inputMessage" role="status"></p>
        <div class="output-group">
            <p>Tip Amount: <span id="tipAmount">$0.00</span></p>
            <p>Total Amount: <span id="totalAmount">$0.00</span></p>
            <p>Amount per Person: <span id="amountPerPerson">$0.00</span></p>
        </div>

        <div class="theme-switcher">
            <button id="themeToggle">Toggle Dark Mode</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
