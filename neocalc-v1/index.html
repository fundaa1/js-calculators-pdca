<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoCalc</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="calculator">
        <button id="themeToggleButton" class="theme-toggle-button" aria-label="Toggle Light Dark Theme">
            <!-- Icon will be set by JavaScript -->
            <i class="fas fa-sun"></i> <!-- Default to sun icon -->
        </button>
        <div class="calculator-display" role="region" aria-live="polite">
            <div class="display-history" aria-label="Previous calculation or context"></div>
            <div class="display-input" aria-label="Current input or result">0</div>
        </div>
        <div class="calculator-keys">
            <button class="key key-ac" aria-label="All Clear">AC</button>
            <button class="key key-del" aria-label="Delete"><i class="fas fa-backspace"></i></button>
            <button class="key key-sign" aria-label="Toggle Sign"><i class="fas fa-plus-minus"></i></button>
            <button class="key key-operator" data-operator="/" aria-label="Divide"><i class="fas fa-divide"></i></button>

            <button class="key key-number" data-number="7">7</button>
            <button class="key key-number" data-number="8">8</button>
            <button class="key key-number" data-number="9">9</button>
            <button class="key key-operator" data-operator="*" aria-label="Multiply"><i class="fas fa-times"></i></button>

            <button class="key key-number" data-number="4">4</button>
            <button class="key key-number" data-number="5">5</button>
            <button class="key key-number" data-number="6">6</button>
            <button class="key key-operator" data-operator="-" aria-label="Subtract"><i class="fas fa-minus"></i></button>

            <button class="key key-number" data-number="1">1</button>
            <button class="key key-number" data-number="2">2</button>
            <button class="key key-number" data-number="3">3</button>
            <button class="key key-operator" data-operator="+" aria-label="Add"><i class="fas fa-plus"></i></button>

            <button class="key key-number key-zero" data-number="0">0</button>
            <button class="key key-decimal" data-number="." aria-label="Decimal">.</button>
            <button class="key key-percent" aria-label="Percentage"><i class="fas fa-percentage"></i></button>
            <button class="key key-equals" data-operator="=" aria-label="Equals">=</button>
        </div>

        <div class="calculator-history-log-panel" role="region" aria-live="polite" aria-atomic="true">
            <h4 id="historyLogHeading">History</h4>
            <ul id="historyLogList" aria-labelledby="historyLogHeading">
                <!-- History items will be populated here by JavaScript -->
            </ul>
            <!-- Optional: <button id="clearHistoryButton">Clear History</button> -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
